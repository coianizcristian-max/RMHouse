# Backup del database RMHouse ogni 4 ore.
# Va messo in un repository GitHub PRIVATO a parte (es. "rmhouse-backup"), non in quello del sito.
# Segreti da impostare nel repository (Settings → Secrets and variables → Actions → New repository secret):
#   DB_URL           stringa di connessione di Supabase, "Session pooler" (Connect → Session pooler), con la password del database
#   BACKUP_PASSWORD  una password lunga a scelta: il file viene cifrato con questa (senza, non si apre)
name: Backup database

on:
  schedule:
    - cron: '17 */4 * * *'      # ogni 4 ore (ora UTC: 00:17, 04:17, 08:17…)
  workflow_dispatch:            # e a mano, col pulsante "Run workflow"

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Strumenti di PostgreSQL 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17

      - name: Copia del database (dati, utenti, struttura)
        env:
          DB_URL: ${{ secrets.DB_URL }}
        run: |
          NOME="rmhouse-$(date -u +%Y-%m-%d_%H%M)"
          echo "NOME=$NOME" >> $GITHUB_ENV
          /usr/lib/postgresql/17/bin/pg_dump "$DB_URL" -Fc --no-owner --no-privileges \
            --schema=public --schema=auth --schema=storage -f "$NOME.dump"
          ls -lh "$NOME.dump"

      - name: Cifratura
        env:
          BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSWORD" --symmetric --cipher-algo AES256 -o "$NOME.dump.gpg" "$NOME.dump"
          rm "$NOME.dump"

      - name: Conservazione (7 giorni)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NOME }}
          path: ${{ env.NOME }}.dump.gpg
          retention-days: 7
